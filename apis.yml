aid: hive-power
name: Hive Power
description: >-
  Hive Power SA is a Swiss software company (Manno, Ticino) building FLEXO, a
  Flexibility Orchestrator that connects distributed energy assets — electric
  vehicles, stationary batteries, solar systems, and smart appliances — to
  electricity markets and grid services. FLEXO pairs an AI optimization engine
  (weather, price, and behavior forecasting) with a REST API mid-layer and
  end-user/admin interfaces to deliver smart charging (V1G/V2G/V2X), virtual
  power plant (VPP) aggregation, battery monetization, energy-community
  management, and local optimization. The platform is hardware-agnostic,
  integrating EVs, chargers, batteries, and solar/EMS via IoT platforms and
  manufacturer APIs (Enode, ABB, Huawei, LG, SMA, Easee, ChargePoint) and
  protocols such as MODBUS, MQTT, and OCPP. Backed by Techstars.
